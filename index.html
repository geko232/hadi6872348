<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ghost VPN</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #09090b; --card: #18181b; --accent: #3b82f6; --text: #f8fafc; --muted: #a1a1aa; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, sans-serif; user-select: none; }
        body { background: var(--bg); color: var(--text); padding: 16px 16px 90px; max-width: 480px; margin: 0 auto; }
        
        .card { background: var(--card); border-radius: 16px; padding: 16px; margin-bottom: 12px; border: 1px solid #27272a; }
        .header { display: flex; align-items: center; justify-content: space-between; }
        .user-info { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 42px; height: 42px; border-radius: 12px; background: linear-gradient(135deg, #3b82f6, #8b5cf6); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        
        .title { font-size: 16px; font-weight: 700; }
        .subtitle { font-size: 12px; color: var(--muted); margin-top: 2px; }
        
        .tab-content { display: none; animation: fadeIn 0.2s ease; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        .btn { width: 100%; padding: 14px; border-radius: 12px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; text-decoration: none; margin-top: 10px; }
        .btn:active { transform: scale(0.97); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-secondary { background: #27272a; color: #fff; }

        .plan-card { background: #27272a; border-radius: 12px; padding: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid transparent; position: relative; }
        .plan-card.active { border-color: var(--accent); background: rgba(59, 130, 246, 0.1); }
        .plan-title { font-size: 14px; font-weight: 600; }
        .plan-desc { font-size: 12px; color: var(--muted); }
        .plan-price { font-size: 16px; font-weight: 700; color: var(--accent); }
        .plan-badge { position: absolute; top: -6px; right: 12px; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }
        .badge-cyan { background: var(--accent); color: #fff; }
        .badge-gold { background: #f59e0b; color: #fff; }

        .input-box { width: 100%; background: #09090b; border: 1px solid #3f3f46; border-radius: 10px; padding: 12px; color: #fff; outline: none; margin-bottom: 10px; }
        .input-box:focus { border-color: var(--accent); }

        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(24, 24, 27, 0.9); backdrop-filter: blur(10px); display: flex; padding: 10px 16px 20px; border-top: 1px solid #27272a; z-index: 100; }
        .nav-btn { flex: 1; text-align: center; background: none; border: none; color: var(--muted); font-size: 11px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; }
        .nav-btn.active { color: var(--accent); font-weight: 600; }
        .nav-btn span { font-size: 20px; }
    </style>
</head>
<body>

    <div class="card header">
        <div class="user-info">
            <div class="avatar">👻</div>
            <div>
                <div class="title" id="user-name">Ghost VPN</div>
                <div class="subtitle">Германия 🇩🇪 • VLESS</div>
            </div>
        </div>
    </div>

    <!-- ГЛАВНАЯ -->
    <div id="tab-home" class="tab-content active">
        <div class="card">
            <h3 style="margin-bottom: 10px;">Как подключиться:</h3>
            <p style="font-size: 13px; color: var(--muted); line-height: 1.5; margin-bottom: 10px;">
                1. Выберите тариф в разделе «Тарифы».<br>
                2. Бот мгновенно пришлет ваш ключ.<br>
                3. Вставьте его в v2rayTun или Hiddify.
            </p>
            <button onclick="switchTab('tariffs')" class="btn btn-primary">💎 Выбрать тариф</button>
            <button onclick="requestMyStatus()" class="btn btn-secondary">🔑 Моя подписка</button>
        </div>
    </div>

    <!-- ТАРИФЫ -->
    <div id="tab-tariffs" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom: 12px;">Тарифные планы</h3>
            <div id="tariffs-container" style="max-height: 400px; overflow-y: auto;"></div>
            <button id="pay-btn" onclick="pay()" class="btn btn-primary" style="margin-top: 12px;">💳 Оплатить 195 ₽ — 3 месяца</button>
        </div>
    </div>

    <!-- ПРОМОКОДЫ -->
    <div id="tab-terms" class="tab-content">
        <div class="card">
            <h3 style="margin-bottom: 10px;">Активация промокода</h3>
            <input type="text" id="promo-input" placeholder="Введите код..." class="input-box">
            <button onclick="activatePromo()" class="btn btn-primary">✨ Активировать</button>
        </div>
    </div>

    <!-- АДМИНКА -->
    <div id="tab-admin" class="tab-content">
        <div class="card" style="border-color: #f59e0b;">
            <h3 style="color: #f59e0b; margin-bottom: 10px;">👑 Выдать подписку</h3>
            <input type="text" id="adm-id" placeholder="@username или ID" class="input-box">
            <input type="number" id="adm-days" placeholder="Количество дней" value="90" class="input-box">
            <button onclick="adminGive()" class="btn" style="background: #f59e0b; color: #000;">🎁 Выдать</button>
        </div>
        <div class="card" style="border-color: #8b5cf6;">
            <h3 style="color: #8b5cf6; margin-bottom: 10px;">🎟 Создать промокод</h3>
            <input type="text" id="adm-promo" placeholder="Название" class="input-box">
            <input type="number" id="adm-disc" placeholder="Дни" value="30" class="input-box">
            <button onclick="adminPromo()" class="btn" style="background: #8b5cf6; color: #fff;">💾 Сохранить</button>
        </div>
    </div>

    <!-- НАВИГАЦИЯ -->
    <div class="nav-bar">
        <button onclick="switchTab('home')" id="nav-home" class="nav-btn active"><span>⚡</span>Главная</button>
        <button onclick="switchTab('tariffs')" id="nav-tariffs" class="nav-btn"><span>💎</span>Тарифы</button>
        <button onclick="switchTab('terms')" id="nav-terms" class="nav-btn"><span>🎟</span>Промо</button>
        <button onclick="switchTab('admin')" id="nav-admin" class="nav-btn" style="display: none;"><span>👑</span>Админ</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        const ADMIN_ID = 8355574595;
        const currentUser = tg.initDataUnsafe?.user;
        const isOwner = (currentUser && Number(currentUser.id) === ADMIN_ID);
        
        let price = 195, plan = '3 месяца', days = 90;

        const TARIFFS = [
            {months: 1, days: 30, price: 70, title: "1 месяц", desc: "30 дней • 70 ₽/мес", badge: ""},
            {months: 2, days: 60, price: 135, title: "2 месяца", desc: "60 дней • 67 ₽/мес", badge: ""},
            {months: 3, days: 90, price: 195, title: "3 месяца", desc: "90 дней • 65 ₽/мес", badge: "ХИТ"},
            {months: 4, days: 120, price: 255, title: "4 месяца", desc: "120 дней • 63 ₽/мес", badge: ""},
            {months: 5, days: 150, price: 310, title: "5 месяцев", desc: "150 дней • 62 ₽/мес", badge: ""},
            {months: 6, days: 180, price: 360, title: "6 месяцев", desc: "180 дней • 60 ₽/мес", badge: "ВЫГОДНО"},
            {months: 7, days: 210, price: 415, title: "7 месяцев", desc: "210 дней • 59 ₽/мес", badge: ""},
            {months: 8, days: 240, price: 465, title: "8 месяцев", desc: "240 дней • 58 ₽/мес", badge: ""},
            {months: 9, days: 270, price: 515, title: "9 месяцев", desc: "270 дней • 57 ₽/мес", badge: ""},
            {months: 10, days: 300, price: 560, title: "10 месяцев", desc: "300 дней • 56 ₽/мес", badge: ""},
            {months: 11, days: 330, price: 605, title: "11 месяцев", desc: "330 дней • 55 ₽/мес", badge: ""},
            {months: 12, days: 365, price: 650, title: "12 месяцев", desc: "365 дней • 54 ₽/мес", badge: "MAX ВЫГОДА"}
        ];

        document.addEventListener('DOMContentLoaded', () => {
            if (currentUser?.first_name) document.getElementById('user-name').innerText = currentUser.first_name;
            
            // Генерация тарифов
            const container = document.getElementById('tariffs-container');
            TARIFFS.forEach(t => {
                const isActive = t.months === 3 ? 'active' : '';
                const badgeClass = t.badge.includes("MAX") ? "badge-gold" : "badge-cyan";
                const badgeHtml = t.badge ? `<span class="plan-badge ${badgeClass}">${t.badge}</span>` : "";
                
                container.innerHTML += `
                <div onclick="selectPlan(${t.price}, '${t.title}', ${t.days}, this)" class="plan-card ${isActive}">
                    ${badgeHtml}
                    <div><div class="plan-title">${t.title}</div><div class="plan-desc">${t.desc}</div></div>
                    <div class="plan-price">${t.price} ₽</div>
                </div>`;
            });

            // УДАЛЕНИЕ админки из структуры, если это не админ
            if (!isOwner) {
                const tAdmin = document.getElementById('tab-admin');
                const nAdmin = document.getElementById('nav-admin');
                if (tAdmin) tAdmin.remove();
                if (nAdmin) nAdmin.remove();
            } else {
                document.getElementById('nav-admin').style.display = 'flex';
            }
        });

        function switchTab(tab) {
            if (tab === 'admin' && !isOwner) return;
            document.querySelectorAll('.tab-content, .nav-btn').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            document.getElementById('nav-' + tab).classList.add('active');
        }

        function selectPlan(p, pl, d, el) {
            price = p; plan = pl; days = d;
            document.querySelectorAll('.plan-card').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            document.getElementById('pay-btn').innerText = `💳 Оплатить ${price} ₽ — ${plan}`;
        }

        function pay() { tg.sendData(JSON.stringify({ action: "buy", plan, price, days })); }
        function requestMyStatus() { tg.sendData(JSON.stringify({ action: "status" })); }
        
        function activatePromo() {
            const code = document.getElementById('promo-input').value.trim();
            if (code) tg.sendData(JSON.stringify({ action: "promo", code }));
        }

        function adminGive() {
            if (!isOwner) return;
            const id = document.getElementById('adm-id').value.trim();
            const d = document.getElementById('adm-days').value.trim();
            if (id && d) tg.sendData(JSON.stringify({ action: "admin_give", identifier: id, days: d }));
        }

        function adminPromo() {
            if (!isOwner) return;
            const promo = document.getElementById('adm-promo').value.trim();
            const d = document.getElementById('adm-disc').value.trim();
            if (promo && d) tg.sendData(JSON.stringify({ action: "admin_promo", promo, discount: d }));
        }
    </script>
</body>
</html>
